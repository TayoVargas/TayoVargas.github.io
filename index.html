<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Te amo ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="stars"></div>
    <div id="flash"></div>
    <canvas id="confetti"></canvas>

    <div class="card">

        <!-- Historia -->
        <div id="story">

            <h1>Para la persona que convierte mis días normales en los mejores. ❤️</h1>

            <p id="text"></p>

            <button id="btn">Comenzar</button>

        </div>

        <!-- Sorpresa -->
        <div id="reveal" class="hide">

            <!-- Conteo -->
            <div id="countdown" class="hide">

                <h2 style="margin-bottom:30px;">
                    La sorpresa es...
                </h2>

                <div id="number">
                    3
                </div>

            </div>

            <!-- Contenido final -->
            <div id="finalContent" class="hide">

                <h1>NOS VAMOS A VER A HARRY STYLES ❤️</h1>

                <img src="boletos.JPG" alt="Boletos">

                <p>
                    Te prometí que haría todo lo posible por cumplir tus sueños.
                    <br><br>
                    Gracias por hacerme tan feliz.
                    <br><br>
                    Te amo muchísimo mi amor ❤️
                </p>

            </div>

        </div>

    </div>

    <audio id="music" src="song.mp3" loop></audio>

    <script src="script.js"></script>

</body>

</html>
